<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Consultas de promociones y productos Coca-Cola CCEP">
  <meta property="og:title" content="Consultas Coca-Cola CCEP">
  <link rel="apple-touch-icon" href="icons/icon-512x512.png">
  <title>Foto de Éxito - Coca-Cola</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- Abrir antes las conexiones a Firebase: ahorra la negociación en la primera imagen -->
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css?v=40">
  <style>
    .admin-link {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: var(--color-primary);
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.3s;
    }
    .admin-link:hover { opacity: 0.8; }
    #product-list.hidden { display: none; }
  </style>
</head>
<body>

  <div id="login-container">
    <form id="login-form">
      <h2>Foto de Éxito</h2>
      <input type="text" id="username" name="username" placeholder="Usuario (email)" autocomplete="username" required>
      <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <a href="admin.html" class="admin-link">⚙️ Panel de Administración</a>
    </form>
  </div>

  <div id="contenido" class="hidden">
    <header>
      <h1>FOTO DE ÉXITO <span style="font-size: 0.75rem; opacity: 0.7; font-weight: 500; letter-spacing: 0.5px; vertical-align: super; margin-left: 4px;">v40</span></h1>
      <div class="header-controls">
        <button id="install-btn" class="btn-header hidden" aria-label="Instalar App">📱 Instalar</button>
        <button id="dark-mode-btn" class="btn-header" aria-label="Alternar Modo Oscuro">🌙</button>
        <button id="logout-btn" class="btn-logout btn-header" aria-label="Cerrar sesión">🚪 Salir</button>
      </div>
    </header>
    <main>
      <section id="update-status" class="update-status" aria-label="Actualizaciones y filtro de secciones"></section>
      <section id="product-list" aria-live="polite"></section>
    </main>
  </div>

  <div id="fullscreen-modal" class="fullscreen-modal-overlay hidden">
    <span class="close-fullscreen-modal">&times;</span>
    <div class="fullscreen-modal-content"></div>
  </div>

  <div id="toast" class="toast">Notificación</div>

  <div id="update-notice" class="update-notice" role="status" aria-live="polite"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
    import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3SNRVPID2Gz85UhESHr_OEdxsL1PNodM",
      authDomain: "cocacolaconsultas-20759.firebaseapp.com",
      projectId: "cocacolaconsultas-20759",
      storageBucket: "cocacolaconsultas-20759.firebasestorage.app",
      messagingSenderId: "274074684363",
      appId: "1:274074684363:web:b988c76c7e74f9e1e3444e",
      measurementId: "G-29GJZ22GMM"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // Habilitar caché offline de Firestore para trabajar sin conexión
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
    });
    const storage = getStorage(app);

    const loginContainer = document.getElementById("login-container");
    const contenidoDiv = document.getElementById("contenido");
    const loginForm = document.getElementById("login-form");
    const headerH1 = document.querySelector("#contenido header h1");
    const logoutBtn = document.getElementById("logout-btn");

    function mostrarContenido() {
      loginContainer.style.display = "none";
      contenidoDiv.classList.remove("hidden");
    }

    onAuthStateChanged(auth, user => {
      if (user) {
        mostrarContenido();
        localStorage.setItem("loggedInUser", user.email);
        startMetadataSync();
      } else {
        stopMetadataSync();
        loginContainer.style.display = "flex";
        contenidoDiv.classList.add("hidden");
      }
    });

    loginForm.addEventListener("submit", e => {
      e.preventDefault();
      const email = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      
      if (!email || !password) {
        alert("Por favor ingresa usuario y contraseña.");
        return;
      }
      
      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          console.log("✅ Login exitoso");
          if (window.triggerHaptic) window.triggerHaptic('success');
          mostrarContenido();
        })
        .catch(err => {
          console.error(err);
          alert("Credenciales incorrectas.");
        });
    });

    logoutBtn.addEventListener("click", async () => {
      if (!confirm("¿Estás seguro de que quieres cerrar sesión?")) return;
      try {
        if (window.triggerHaptic) window.triggerHaptic('medium');
        await signOut(auth);
        localStorage.removeItem("loggedInUser");
      } catch (error) {
        console.error("Error al cerrar sesión:", error);
        alert("❌ Error al cerrar sesión");
      }
    });

    // ========================
    // SINCRONIZACIÓN DE IMÁGENES
    // ========================
    const IMAGE_CACHE = 'cocacola-images-v36'; // mismo nombre que en sw.js
    const FRESH_MS = 7 * 24 * 60 * 60 * 1000;  // "nuevo": subido en los últimos 7 días
    let unsubscribeMetadata = null;

    function readJSON(key) {
      try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; }
    }

    function writeJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    // Guardado agrupado: al resolver muchas URLs seguidas no se serializa el mapa cada vez
    let persistUrlsTimer = null;
    function persistUrls() {
      clearTimeout(persistUrlsTimer);
      persistUrlsTimer = setTimeout(() => writeJSON('firebaseImageUrls', window.firebaseImageUrls), 1000);
    }

    function imagePath(folder, index, isThumb) {
      return `images/${folder}/${folder}_${index}${isThumb ? '_thumb' : ''}.jpg`;
    }

    function renderProducts() {
      window.updateProductListFromScript?.();
      window.updateProductImages?.();
      window.lazyLoadImages?.();
    }

    // Arranca con lo guardado en el dispositivo (funciona sin conexión) y escucha
    // los cambios del admin en tiempo real
    function startMetadataSync() {
      try {
        if (localStorage.getItem('appCacheVersion') !== 'v36') {
          console.log('🔄 Nueva versión detectada (v36). Purgando cachés locales obsoletas...');
          localStorage.removeItem('firebaseImageUrls');
          localStorage.removeItem('firebaseImageLastUpdates');
          localStorage.removeItem('firebaseImageActualCounts');
          localStorage.setItem('appCacheVersion', 'v36');
        }
      } catch (e) {}

      window.firebaseImageUrls = { ...readJSON('firebaseImageUrls'), ...window.firebaseImageUrls };
      window.firebaseImageActualCounts = { ...readJSON('firebaseImageActualCounts'), ...window.firebaseImageActualCounts };
      window.firebaseImageUpdatedAt = { ...readJSON('firebaseImageLastUpdates'), ...window.firebaseImageUpdatedAt };
      renderProducts();

      // Pedir al navegador que no borre la caché offline cuando le falte espacio
      navigator.storage?.persist?.().catch(() => {});

      if (unsubscribeMetadata) return;
      unsubscribeMetadata = onSnapshot(doc(db, 'metadata', 'imageCounts'), snapshot => {
        if (snapshot.exists()) applyRemoteMetadata(snapshot.data());
      }, error => {
        console.error('❌ Error al sincronizar metadatos:', error);
        if (error.code === 'permission-denied') window.showToast?.('⚠️ No se pudieron sincronizar todos los datos', 'error');
      });
    }

    function stopMetadataSync() {
      unsubscribeMetadata?.();
      unsubscribeMetadata = null;
    }

    function applyRemoteMetadata(remoteData) {
      const lastUpdates = window.firebaseImageUpdatedAt;
      // En la primera sincronización del dispositivo todo parecería nuevo: no avisar
      const hasHistory = Object.keys(lastUpdates).length > 0;
      const counts = {};
      const changedFolders = [];

      for (const [key, val] of Object.entries(remoteData)) {
        if (typeof val === 'number' && val >= 0) {
          counts[key] = val;
        } else if (key.endsWith('_updatedAt') && typeof val === 'string') {
          const folder = key.slice(0, -'_updatedAt'.length);
          const localTime = lastUpdates[folder] ? new Date(lastUpdates[folder]).getTime() : 0;
          if (new Date(val).getTime() > localTime) {
            // Las URLs antiguas de la carpeta ya no existen (el admin borra y vuelve a subir)
            const prefix = `images/${folder}/`;
            for (const urlKey of Object.keys(window.firebaseImageUrls)) {
              if (urlKey.startsWith(prefix)) delete window.firebaseImageUrls[urlKey];
            }
            lastUpdates[folder] = val;
            changedFolders.push(folder);
          }
        }
      }

      // URLs de descarga guardadas por el admin: evitan pedir getDownloadURL imagen a imagen
      for (const [key, val] of Object.entries(remoteData)) {
        const match = key.match(/^(.+)_(image|thumb)Urls$/);
        if (!match || !Array.isArray(val)) continue;
        val.forEach((url, index) => {
          if (url) window.firebaseImageUrls[imagePath(match[1], index, match[2] === 'thumb')] = url;
        });
      }

      window.firebaseImageActualCounts = { ...window.firebaseImageActualCounts, ...counts };
      writeJSON('firebaseImageActualCounts', window.firebaseImageActualCounts);
      writeJSON('firebaseImageLastUpdates', lastUpdates);
      writeJSON('firebaseImageUrls', window.firebaseImageUrls);
      renderProducts();

      if (changedFolders.length) {
        pruneImageCache(changedFolders);
        // Solo carpetas con contenido (al traspasar un periodo, SIGUIENTE queda vacía)
        const newContent = changedFolders.filter(folder => counts[folder] > 0);
        if (hasHistory && newContent.length) window.notifyNewUploads?.(newContent);
      }
      schedulePrecache();
    }

    // Borra de la caché offline las versiones anteriores de las carpetas actualizadas
    async function pruneImageCache(folders) {
      if (!('caches' in window)) return;
      try {
        const currentUrls = new Set(Object.values(window.firebaseImageUrls));
        const cache = await caches.open(IMAGE_CACHE);
        for (const request of await cache.keys()) {
          const inFolder = folders.some(folder => request.url.includes(`images%2F${folder}%2F`));
          if (inFolder && !currentUrls.has(request.url)) await cache.delete(request);
        }
      } catch (e) {
        console.warn('⚠️ No se pudo limpiar la caché de imágenes:', e);
      }
    }

    // ── Descarga en segundo plano para usar la app sin conexión ──
    const precacheQueue = new Set();
    let precacheRunning = false;
    let precacheTimer = null;

    function canPrecache() {
      const connection = navigator.connection;
      return navigator.onLine && !(connection && (connection.saveData || /2g$/.test(connection.effectiveType || '')));
    }

    function queuePrecache(urls) {
      urls.forEach(url => url && precacheQueue.add(url));
      clearTimeout(precacheTimer);
      // Esperar a que termine la carga visible para no competir con ella
      precacheTimer = setTimeout(runPrecache, 3000);
    }

    // Miniaturas de todas las secciones (pesan poco) y fotos completas de lo subido esta semana
    function schedulePrecache() {
      const now = Date.now();
      const thumbs = [];
      const fullImages = [];
      for (const [path, url] of Object.entries(window.firebaseImageUrls)) {
        if (path.endsWith('_thumb.jpg')) {
          thumbs.push(url);
        } else {
          const updatedAt = window.firebaseImageUpdatedAt[path.split('/')[1]];
          if (updatedAt && now - new Date(updatedAt).getTime() < FRESH_MS) fullImages.push(url);
        }
      }
      queuePrecache([...thumbs, ...fullImages]);
    }

    async function runPrecache() {
      if (precacheRunning || !('caches' in window) || !canPrecache()) return;
      precacheRunning = true;
      try {
        const { usage = 0, quota = Infinity } = await navigator.storage?.estimate?.() || {};
        if (usage / quota > 0.8) return;

        const cache = await caches.open(IMAGE_CACHE);
        const worker = async () => {
          while (precacheQueue.size && canPrecache()) {
            const url = precacheQueue.values().next().value;
            precacheQueue.delete(url);
            if (await cache.match(url)) continue;
            try {
              const response = await fetch(url, { mode: 'cors' });
              // Con el Service Worker activo es él quien la guarda; si no, la guardamos aquí
              if (response.ok && !navigator.serviceWorker?.controller) await cache.put(url, response);
              else await response.blob();
            } catch (e) {
              // Sin conexión o URL caducada: se reintentará en la próxima sincronización
            }
          }
        };
        await Promise.all([worker(), worker()]);
      } finally {
        precacheRunning = false;
      }
    }

    window.addEventListener('online', () => {
      if (auth.currentUser) schedulePrecache();
    });

    // Mapeo y helper para URLs de Firebase a nivel de módulo
    window.firebaseImageUrls = window.firebaseImageUrls || {};

    async function ensureUrl(key, forceRefresh = false) {
      // Si no forzamos refresh y la URL está en caché, usarla
      if (!forceRefresh && window.firebaseImageUrls[key]) {
        return window.firebaseImageUrls[key];
      }
      try {
        // Si estamos forzando refresh, eliminar la URL cacheada primero
        if (forceRefresh) {
          delete window.firebaseImageUrls[key];
          console.log(`🔄 Refrescando URL para: ${key}`);
        }
        let url = await getDownloadURL(ref(storage, key)).catch(async (e) => {
          if (key.includes('_thumb.jpg')) {
            return await getDownloadURL(ref(storage, key.replace('_thumb.jpg', '.jpg')));
          }
          throw e;
        });
        window.firebaseImageUrls[key] = url;
        persistUrls();
        return url;
      } catch (e) {
        console.warn(`⚠️ No URL para ${key}`);
        return null;
      }
    }

    // Exponer ensureUrl globalmente para que el onerror handler pueda refrescar URLs expiradas
    window.ensureUrl = ensureUrl;

    // ACTUALIZAR IMÁGENES (asigna data-full bajo demanda)
    window.updateProductImages = function() {
      document.querySelectorAll('.product img[data-src]').forEach(img => {
        const storagePath = img.dataset.src.trim();
        const url = window.firebaseImageUrls[storagePath];
        if (url) {
          // Asignar la URL de caché a TODAS las imágenes, incluyendo las lazy
          // Esto evita que queden en blanco si el observer ya pasó
          if (img.src !== url && !img.src.includes('firebasestorage')) {
            img.src = url;
            img.classList.remove('lazy');
            img.closest('.product')?.classList.remove('is-loading');
            img.parentElement?.classList.remove('skeleton');
          }
        }

        // Si ya tenemos la imagen completa resuelta en caché, la asignamos a data-full
        const fullPath = img.getAttribute('data-full-path') || img.dataset.full;
        if (fullPath && !fullPath.startsWith('http')) {
          if (!img.getAttribute('data-full-path')) {
            img.setAttribute('data-full-path', fullPath);
          }
          const fullUrl = window.firebaseImageUrls[fullPath];
          if (fullUrl) {
            img.dataset.full = fullUrl;
          }
        }
      });
    };

    // LAZY LOADING SIMPLIFICADO Y ROBUSTO
    window.lazyLoadImages = function() {
      // Limpiar observer anterior si existe
      if (window.imageObserver) {
        window.imageObserver.disconnect();
        window.imageObserver = null;
      }

      const imgs = Array.from(document.querySelectorAll('img.lazy'));
      if (!imgs.length) return;

      const loadQueue = [];
      let isProcessing = false;

      async function loadOne(img) {
        const currentSrc = img.getAttribute('src') || '';
        if (currentSrc.includes('firebasestorage')) return;
        
        const key = (img.dataset.src || '').trim();
        if (!key) return;
        
        // Cargar miniatura - intentar con caché primero, el onerror handler se encargará
        // de refrescar la URL si está expirada
        let url = await ensureUrl(key);
        if (url) {
          img.src = url;
          img.classList.remove('lazy');
        } else {
          // No hay URL en caché ni en Firebase - intentar refrescar forzadamente
          url = await ensureUrl(key, true);
          if (url) {
            img.src = url;
            img.classList.remove('lazy');
          } else {
            console.warn(`🚫 No se pudo obtener URL para miniatura: ${key}`);
            img.src = 'icons/icon-192.png';
            img.style.opacity = '0.4';
            img.classList.remove('lazy');
            img.closest('.product')?.classList.remove('is-loading');
            img.parentElement?.classList.remove('skeleton');
          }
        }

        // Guardar la imagen de alta resolución para verla sin conexión, en segundo plano
        // y con baja prioridad para no retrasar las miniaturas
        const fullPath = img.getAttribute('data-full-path') || img.dataset.full;
        if (fullPath && !fullPath.startsWith('http')) {
          if (!img.getAttribute('data-full-path')) {
            img.setAttribute('data-full-path', fullPath);
          }
          const fullUrl = await ensureUrl(fullPath);
          if (fullUrl) {
            img.dataset.full = fullUrl;
            queuePrecache([fullUrl]);
          }
        }
      }

      // Procesar cola en lotes de 8
      async function processQueue() {
        if (isProcessing) return;
        isProcessing = true;
        while (loadQueue.length > 0) {
          const batch = loadQueue.splice(0, 8);
          await Promise.allSettled(batch.map(img => loadOne(img)));
        }
        isProcessing = false;
      }

      function queueImage(img) {
        if (!img.classList.contains('lazy')) return;
        loadQueue.push(img);
        processQueue();
      }

      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting && e.target.classList.contains('lazy')) {
              queueImage(e.target);
              observer.unobserve(e.target);
            }
          });
        }, { 
          rootMargin: '500px 800px 500px 800px',
          threshold: 0
        });
        
        imgs.forEach(img => observer.observe(img));
        window.imageObserver = observer;
      } else {
        // Fallback: cargar todas directamente
        imgs.forEach(img => queueImage(img));
      }
    };

    // FULLSCREEN MODAL CON NAVEGACIÓN SWIPE/FLECHAS
    window.initFullscreenModal = function() {
      const productList = document.getElementById('product-list');
      const modal = document.getElementById('fullscreen-modal');
      const modalContent = modal.querySelector('.fullscreen-modal-content');
      const closeBtn = modal.querySelector('.close-fullscreen-modal');

      let currentSection = [];
      let currentIndex = 0;
      
      // Variables para zoom táctil
      let currentZoom = 1;
      let currentPanX = 0;
      let currentPanY = 0;
      let isZooming = false;
      let initialDistance = 0;
      let initialZoom = 1;
      let initialPanX = 0;
      let initialPanY = 0;
      let lastTouchX = 0;
      let lastTouchY = 0;
      let isPanning = false;

      function openModal(card) {
        const section = card.closest('.section');
        const allCards = Array.from(section.querySelectorAll('.product[data-section-name]'));
        currentSection = allCards.filter(c => c.querySelector('img[data-full]'));
        currentIndex = currentSection.indexOf(card);

        // Resetear zoom al abrir nueva imagen
        currentZoom = 1;
        currentPanX = 0;
        currentPanY = 0;

        const performOpen = () => {
          showImage(currentIndex);
          modal.classList.remove('hidden');
          modal.classList.add('active');
          document.body.style.overflow = 'hidden';
        };

        if (window.triggerHaptic) window.triggerHaptic('medium');
        if (document.startViewTransition) {
          document.startViewTransition(performOpen);
        } else {
          performOpen();
        }
      }

      async function showImage(index) {
        if (index < 0 || index >= currentSection.length) return;
        
        const card = currentSection[index];
        const cardImg = card.querySelector('img[data-full]');
        const rawSrc = cardImg?.dataset.full || cardImg?.src;
        if (!rawSrc) return;

        // Si es una ruta de Firebase, resolverla con ensureUrl
        let finalSrc = rawSrc;
        if (!rawSrc.startsWith('http') && !rawSrc.startsWith('data:')) {
          try {
            const url = await ensureUrl(rawSrc);
            if (url) finalSrc = url;
          } catch(e) {}
        }

        const prevDisabled = index === 0 ? 'style="opacity:0.3;pointer-events:none;"' : '';
        const nextDisabled = index === currentSection.length - 1 ? 'style="opacity:0.3;pointer-events:none;"' : '';

        // Limpiar imagen anterior para liberar memoria antes de cargar nueva
        const oldImg = modalContent.querySelector('img');
        if (oldImg) {
          oldImg.src = '';
          oldImg.remove();
        }
        
        // Limpiar zoom al cambiar imagen
        currentZoom = 1;
        currentPanX = 0;
        currentPanY = 0;
        
        // Crear nueva imagen y precargar
        const newImg = document.createElement('img');
        newImg.crossOrigin = "anonymous";
        newImg.src = finalSrc;
        newImg.alt = `Imagen ${index + 1}`;
        newImg.title = 'Doble toque para ampliar / Pellizca para zoom';
        newImg.loading = 'eager'; // Cargar inmediatamente en modal
        newImg.className = 'zoomable-image';
        newImg.style.transform = `translate(${currentPanX}px, ${currentPanY}px) scale(${currentZoom})`;
        newImg.style.transformOrigin = 'center center';
        newImg.style.transition = currentZoom === 1 ? 'transform 0.3s ease' : 'none';
        
        modalContent.innerHTML = `
          <button class="modal-nav modal-nav-prev" ${prevDisabled}>‹</button>
          <button class="modal-nav modal-nav-next" ${nextDisabled}>›</button>
          <div class="modal-counter">${index + 1} / ${currentSection.length}</div>
        `;
        
        modalContent.appendChild(newImg);

        modalContent.querySelector('.modal-nav-prev')?.addEventListener('click', () => navigate(-1));
        modalContent.querySelector('.modal-nav-next')?.addEventListener('click', () => navigate(1));

        // Zoom y navegación
        setupImageZoom(newImg);

        // Precargar las imágenes vecinas para que al deslizar aparezcan al instante
        [index - 1, index + 1].forEach(async neighborIndex => {
          const neighborImg = currentSection[neighborIndex]?.querySelector('img[data-full]');
          const path = neighborImg?.getAttribute('data-full-path') || neighborImg?.dataset.full;
          if (!path) return;
          const url = path.startsWith('http') ? path : await ensureUrl(path);
          if (!url) return;
          const preload = new Image();
          preload.crossOrigin = 'anonymous';
          preload.src = url;
        });

        // Pantalla completa al hacer doble clic en imagen
        let clickTimer = null;
        newImg.addEventListener('click', (e) => {
          if (e.detail === 1) {
            clickTimer = setTimeout(() => {
              // Solo clic simple después de delay
              if (currentZoom === 1) {
                toggleRealFullscreen(e);
              }
            }, 300);
          } else if (e.detail === 2) {
            clearTimeout(clickTimer);
            toggleZoom(e);
          }
        });
      }

      function navigate(direction) {
        // No navegar si está haciendo zoom
        if (isZooming) return;
        
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < currentSection.length) {
          currentIndex = newIndex;
          showImage(currentIndex);
        }
      }
      
      function setupImageZoom(img) {
        // Resetear zoom variables
        isZooming = false;
        isPanning = false;
        
        // Touch events para zoom con pellizco
        img.addEventListener('touchstart', handleTouchStart, { passive: false });
        img.addEventListener('touchmove', handleTouchMove, { passive: false });
        img.addEventListener('touchend', handleTouchEnd, { passive: false });
      }
      
      function handleTouchStart(e) {
        if (e.touches.length === 2) {
          // Gestos de pellizco (zoom)
          isZooming = true;
          e.preventDefault();
          
          const touch1 = e.touches[0];
          const touch2 = e.touches[1];
          
          initialDistance = Math.hypot(
            touch2.clientX - touch1.clientX,
            touch2.clientY - touch1.clientY
          );
          
          initialZoom = currentZoom;
          initialPanX = currentPanX;
          initialPanY = currentPanY;
        } else if (e.touches.length === 1 && currentZoom > 1) {
          // Pan cuando está ampliada
          isPanning = true;
          e.preventDefault();
          
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        }
      }
      
      function handleTouchMove(e) {
        if (e.touches.length === 2 && isZooming) {
          // Calcular zoom con pellizco
          e.preventDefault();
          
          const touch1 = e.touches[0];
          const touch2 = e.touches[1];
          
          const currentDistance = Math.hypot(
            touch2.clientX - touch1.clientX,
            touch2.clientY - touch1.clientY
          );
          
          const scale = currentDistance / initialDistance;
          currentZoom = Math.max(1, Math.min(initialZoom * scale, 5)); // Límite entre 1x y 5x
          
          const img = modalContent.querySelector('.zoomable-image');
          if (img) {
            img.style.transition = 'none';
            img.style.transform = `translate(${currentPanX}px, ${currentPanY}px) scale(${currentZoom})`;
          }
        } else if (e.touches.length === 1 && isPanning && currentZoom > 1) {
          // Pan cuando está ampliada
          e.preventDefault();
          
          const touch = e.touches[0];
          const deltaX = touch.clientX - lastTouchX;
          const deltaY = touch.clientY - lastTouchY;
          
          const img = modalContent.querySelector('.zoomable-image');
          
          // Límites para el pan basados en el tamaño real de la imagen y el nivel de zoom
          const imgWidth = img ? img.clientWidth : window.innerWidth;
          const imgHeight = img ? img.clientHeight : window.innerHeight;
          
          const maxPanX = ((currentZoom - 1) * imgWidth) / 2;
          const maxPanY = ((currentZoom - 1) * imgHeight) / 2;
          
          // Agregamos un margen adicional (+50px) para que sea un "zoom amigable" y se puedan ver bien los bordes
          const limitX = maxPanX + 50;
          const limitY = maxPanY + 50;

          currentPanX = Math.max(-limitX, Math.min(limitX, currentPanX + deltaX));
          currentPanY = Math.max(-limitY, Math.min(limitY, currentPanY + deltaY));
          
          if (img) {
            img.style.transition = 'none';
            img.style.transform = `translate(${currentPanX}px, ${currentPanY}px) scale(${currentZoom})`;
          }
          
          lastTouchX = touch.clientX;
          lastTouchY = touch.clientY;
        }
      }
      
      function handleTouchEnd(e) {
        if (e.touches.length === 0) {
          isZooming = false;
          isPanning = false;
          
          // Resetear si el zoom es muy pequeño
          if (currentZoom < 1.1) {
            currentZoom = 1;
            currentPanX = 0;
            currentPanY = 0;
            
            const img = modalContent.querySelector('.zoomable-image');
            if (img) {
              img.style.transition = 'transform 0.3s ease';
              img.style.transform = 'translate(0px, 0px) scale(1)';
            }
          }
        }
      }
      
      function toggleZoom(e) {
        const img = e.target;
        if (currentZoom === 1) {
          currentZoom = 2;
        } else {
          currentZoom = 1;
          currentPanX = 0;
          currentPanY = 0;
        }
        
        img.style.transition = 'transform 0.3s ease';
        img.style.transform = `translate(${currentPanX}px, ${currentPanY}px) scale(${currentZoom})`;
      }

      function closeModal() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        }
        const performClose = () => {
          modal.classList.remove('active');
          setTimeout(() => {
            modal.classList.add('hidden');
            modalContent.innerHTML = '';
            document.body.style.overflow = '';
          }, 400);
        };

        if (window.triggerHaptic) window.triggerHaptic('light');
        if (document.startViewTransition) {
          document.startViewTransition(performClose);
        } else {
          performClose();
        }
      }

      async function toggleRealFullscreen(e) {
        const img = e.target;
        if (!img) return;

        try {
          if (!document.fullscreenElement) {
            if (img.requestFullscreen) {
              await img.requestFullscreen();
            } else if (img.webkitRequestFullscreen) {
              await img.webkitRequestFullscreen();
            } else if (img.msRequestFullscreen) {
              await img.msRequestFullscreen();
            }
            img.classList.add('in-fullscreen');
          } else {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              await document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
              await document.msExitFullscreen();
            }
            img.classList.remove('in-fullscreen');
          }
        } catch (err) {
          console.error('Error al cambiar pantalla completa:', err);
        }
      }

      document.addEventListener('fullscreenchange', () => {
        const img = modalContent.querySelector('img');
        if (img && !document.fullscreenElement) {
          img.classList.remove('in-fullscreen');
        }
      });

      // Touch/Swipe support con protección contra gestos de pellizco y zoom
      let touchStartX = 0;
      let touchEndX = 0;
      let touchStartY = 0;
      let touchEndY = 0;
      let isPinchGesture = false;
      let touchCount = 0;

      // Detectar si es un gesto de pellizco (2 dedos) o swipe
      modalContent.addEventListener('touchstart', e => {
        // No procesar swipe si está sobre la imagen y hay zoom activo o gestos de pellizco
        const img = e.target.closest('.zoomable-image');
        if (img && (e.touches.length >= 2 || currentZoom > 1)) {
          return; // Dejar que los handlers de zoom se encarguen
        }
        
        touchCount = e.touches.length;
        
        // Si hay 2 o más dedos, es un gesto de pellizco - no hacer swipe
        if (touchCount >= 2) {
          isPinchGesture = true;
          return;
        }
        
        // Solo un dedo - guardar posición inicial
        isPinchGesture = false;
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      modalContent.addEventListener('touchmove', e => {
        // No procesar swipe si está sobre la imagen ampliada
        const img = e.target.closest('.zoomable-image');
        if (img && currentZoom > 1) {
          return;
        }
        
        if (e.touches.length >= 2) {
          isPinchGesture = true;
        }
      }, { passive: true });

      modalContent.addEventListener('touchend', e => {
        // No procesar swipe si está sobre la imagen ampliada o hubo pellizco
        const img = e.target.closest('.zoomable-image');
        if (img && currentZoom > 1) {
          return;
        }
        
        touchCount = e.touches.length;
        
        if (isPinchGesture) {
          if (touchCount >= 1) {
            return;
          }
          setTimeout(() => {
            isPinchGesture = false;
            touchCount = 0;
          }, 100);
          return;
        }
        
        if (touchCount === 0 && e.changedTouches.length === 1) {
          touchEndX = e.changedTouches[0].screenX;
          touchEndY = e.changedTouches[0].screenY;
          handleSwipe();
        }
        
        if (touchCount === 0) {
          isPinchGesture = false;
        }
      }, { passive: true });

      function handleSwipe() {
        // No hacer swipe si hay zoom activo o fue un pellizco
        if (isPinchGesture || currentZoom > 1 || isZooming) return;
        
        const deltaX = Math.abs(touchStartX - touchEndX);
        const deltaY = Math.abs(touchStartY - touchEndY);
        
        const swipeThreshold = 50;
        const minVerticalRatio = 2;
        
        if (deltaX > swipeThreshold && deltaX > deltaY * minVerticalRatio) {
          if (touchStartX - touchEndX > swipeThreshold) {
            navigate(1);
          } else if (touchEndX - touchStartX > swipeThreshold) {
            navigate(-1);
          }
        }
      }

      // Teclado
      document.addEventListener('keydown', e => {
        if (!modal.classList.contains('active')) return;
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'ArrowRight') navigate(1);
        if (e.key === 'Escape') closeModal();
      });

      // Variables para controlar la sensibilidad del modal
      let lastClickTime = 0;
      let clickTimeout = null;
      const DOUBLE_CLICK_DELAY = 300; // ms entre clics para considerar doble clic
      const MIN_CLICK_DELAY = 200; // ms mínimo entre clics para evitar activaciones accidentales

      productList.addEventListener('click', e => {
        const card = e.target.closest('.product');
        if (card && card.querySelector('img[data-full]') && !e.target.closest('button,input,a')) {
          e.preventDefault();
          
          const currentTime = Date.now();
          
          // Evitar clics muy rápidos (accidentales)
          if (currentTime - lastClickTime < MIN_CLICK_DELAY) {
            return;
          }
          
          // Si es el primer clic, esperar un poco para ver si hay un segundo clic
          if (currentTime - lastClickTime > DOUBLE_CLICK_DELAY) {
            clickTimeout = setTimeout(() => {
              // Solo un clic - abrir modal después de un pequeño delay
              setTimeout(() => openModal(card), 100);
            }, DOUBLE_CLICK_DELAY);
          } else {
            // Segundo clic dentro del tiempo - cancelar timeout y abrir inmediatamente
            if (clickTimeout) {
              clearTimeout(clickTimeout);
              clickTimeout = null;
            }
            openModal(card);
          }
          
          lastClickTime = currentTime;
        }
      });

      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', e => {
        if (e.target === modal) closeModal();
      });
    };

    window.auth = auth;
    window.firebaseApp = app;
    window.db = db;
    window.firebaseStorage = storage;

    // Registrar Service Worker para funcionamiento Offline y controlar actualizaciones
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('✅ ServiceWorker registrado con éxito:', registration.scope);
            // Forzar comprobación de actualización del Service Worker en cada carga
            registration.update();
          })
          .catch(err => {
            console.error('❌ Error al registrar ServiceWorker:', err);
          });
      });

      // Detectar cuando el nuevo Service Worker toma el control y recargar la página inmediatamente
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('🔄 Nuevo Service Worker activado, recargando página...');
          window.location.reload();
        }
      });
    }
  </script>
